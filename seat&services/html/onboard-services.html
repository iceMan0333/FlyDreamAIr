<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboard Services</title>
    <link rel="stylesheet" href="../css/onboard-services.css">
    <link rel="stylesheet" href="../../theme.css">
    <link rel="stylesheet" href="../../flydreamair-ui.css">
</head>
<body>
    <div class="container">
        <h2>Onboard Services</h2>
        <!-- Snacks Section -->
        <div class="service-section">
            <h3>Snacks</h3>
            <div class="service-item" id="chocolate-bars-qty">
                <span>Chocolate bars</span>
                <div class="counter">
                    <button class="decrease">-</button>
                    <span class="quantity">0</span>
                    <button class="increase">+</button>
                </div>
            </div>
            <div class="service-item" id="chips-qty">
                <span>Chips</span>
                <div class="counter">
                    <button class="decrease">-</button>
                    <span class="quantity">0</span>
                    <button class="increase">+</button>
                </div>
            </div>
            <div class="service-item" id="cookies-qty">
                <span>Cookies</span>
                <div class="counter">
                    <button class="decrease">-</button>
                    <span class="quantity">0</span>
                    <button class="increase">+</button>
                </div>
            </div>
        </div>

        <!-- Meals Section -->
        <div class="service-section">
            <h3>Meals</h3>
            <div class="service-item" id="rice-bowl-qty">
                <span>Rice Bowl</span>
                <div class="counter">
                    <button class="decrease">-</button>
                    <span class="quantity">0</span>
                    <button class="increase">+</button>
                </div>
            </div>
            <div class="service-item" id="sandwiches-qty">
                <span>Sandwiches</span>
                <div class="counter">
                    <button class="decrease">-</button>
                    <span class="quantity">0</span>
                    <button class="increase">+</button>
                </div>
            </div>
            <div class="service-item" id="pasta-qty">
                <span>Pasta</span>
                <div class="counter">
                    <button class="decrease">-</button>
                    <span class="quantity">0</span>
                    <button class="increase">+</button>
                </div>
            </div>
            <div class="service-item" id="salads-qty">
                <span>Salad</span>
                <div class="counter">
                    <button class="decrease">-</button>
                    <span class="quantity">0</span>
                    <button class="increase">+</button>
                </div>
            </div>
        </div>

        <!-- Drinks Section -->
        <div class="service-section">
            <h3>Drinks</h3>
            <div class="service-item" id="coffee-qty">
                <span>Coffee</span>
                <div class="counter">
                    <button class="decrease">-</button>
                    <span class="quantity">0</span>
                    <button class="increase">+</button>
                </div>
            </div>
            <div class="service-item" id="tea-qty">
                <span>Tea</span>
                <div class="counter">
                    <button class="decrease">-</button>
                    <span class="quantity">0</span>
                    <button class="increase">+</button>
                </div>
            </div>
            <div class="service-item" id="water-qty">
                <span>Water</span>
                <div class="counter">
                    <button class="decrease">-</button>
                    <span class="quantity">0</span>
                    <button class="increase">+</button>
                </div>
            </div>
            <div class="service-item" id="orange-juice-qty">
                <span>Orange juice</span>
                <div class="counter">
                    <button class="decrease">-</button>
                    <span class="quantity">0</span>
                    <button class="increase">+</button>
                </div>
            </div>
        </div>

        <button class="continue-button">Continue</button>
    </div>

    <script src="onboard-services.js"></script>
</body>
</html>
