<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - FlyDreamAir</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Livvic:ital,wght@1,900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../../manageBooking/css/header.css">
    <link rel="stylesheet" href="../../manageBooking/css/footer.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../../theme.css">
    <link rel="stylesheet" href="../../flydreamair-ui.css">
    <script src="../../flydreamair-ui.js" defer></script>
</head>
<body>
<header>
    <div class="flydreamair-parent">
        <div class="flydreamair-logo header-logo">
            <span class="fly">Fly</span><br>
            <span class="dreamair">DreamAir</span>
        </div>
        <div class="deals-parent">
            <a class="deals" href="../../index.html">Home</a>
            <a class="deals" href="../../help/html/help.html">Help</a>
            <a class="deals active" href="profile.html">Profile</a>
            <a class="deals manage-booking" href="../../manageBooking/html/mb.html">Manage Booking</a>
        </div>
    </div>
</header>

<main class="profile-page">
    <section class="profile-hero">
        <div class="avatar" id="avatar">FD</div>
        <div>
            <h1 id="profileName">Your Profile</h1>
            <p id="profileEmail">Manage your demo account, settings, and bookings.</p>
        </div>
    </section>

    <div id="message" class="message" aria-live="polite"></div>

    <section class="profile-grid">
        <div class="profile-card">
            <h2>Account Details</h2>
            <form id="profileForm">
                <label>Username
                    <input type="text" id="username" required>
                </label>
                <label>Email
                    <input type="email" id="email" disabled>
                </label>
                <label>Phone
                    <input type="tel" id="phone">
                </label>
                <label>Date of Birth
                    <input type="date" id="dob" min="1900-01-01">
                </label>
                <button type="submit" class="primary-btn">Save Profile</button>
            </form>
        </div>

        <div class="profile-card">
            <h2>Settings</h2>
            <label class="setting-row">
                <span>Email booking updates</span>
                <input type="checkbox" id="emailUpdates" checked>
            </label>
            <label class="setting-row">
                <span>SMS reminders</span>
                <input type="checkbox" id="smsReminders">
            </label>
            <label class="setting-row">
                <span>Save passenger details for next booking</span>
                <input type="checkbox" id="savePassenger" checked>
            </label>
            <button id="saveSettings" class="secondary-btn">Save Settings</button>
        </div>

        <div class="profile-card wide">
            <h2>Your Upcoming Bookings</h2>
            <div id="bookingSummary" class="booking-summary"></div>
            <div class="profile-actions">
                <a class="primary-btn link-btn" href="../../manageBooking/html/mb.html">Manage Bookings</a>
                <a class="secondary-btn link-btn" href="../../index.html#booking">Book Another Flight</a>
                <button id="logoutBtn" class="danger-btn">Log Out</button>
            </div>
        </div>
    </section>
</main>

<footer>
    <div class="footer-container">
        <div class="footer-terms"><span>Terms</span><span>Privacy</span><span>Cookies</span></div>
    </div>
</footer>
<script src="../js/profile.js"></script>
</body>
</html>
