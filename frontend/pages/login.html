<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – FlyDreamAir</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo">FlyDreamAir</a>
    <ul class="nav-links">
        <li><a href="index.html">Book</a></li>
        <li><a href="manage.html">Manage</a></li>
        <li><a href="shop.html">Shop</a></li>
    </ul>
    <span class="nav-icon">👤</span>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p>Sign in to manage your flights and bookings.</p>

        <!-- Error message box (hidden by default) -->
        <div id="message" class="alert alert-error" style="display:none;"></div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" />
        </div>

        <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="login()">
            Sign In
        </button>

        <div class="auth-switch">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>
</div>

<script src="../js/main.js"></script>
<script>
    async function login() {
        hideMessage("message");

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        // Basic validation
        if (!email || !password) {
            showMessage("message", "Please enter your email and password.");
            return;
        }

        try {
            // FastAPI expects form data for /token endpoint (OAuth2 standard)
            const formData = new URLSearchParams();
            formData.append("username", email);
            formData.append("password", password);

            const response = await fetch(`${API_BASE}/token`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Login failed");
            }

            // Save the token
            saveToken(data.access_token);

            // Get the user profile
            const user = await apiRequest("/users/me");
            saveUser(user);

            // If a user selected a flight before logging in, finish that booking now.
            const pendingFlightRaw = sessionStorage.getItem("pending_flight");
            const afterLogin = sessionStorage.getItem("after_login");
            if (afterLogin === "complete_booking" && pendingFlightRaw) {
                try {
                    const pendingFlight = JSON.parse(pendingFlightRaw);
                    const booking = await apiRequest("/bookings", "POST", { flight_id: pendingFlight.id });
                    sessionStorage.removeItem("pending_flight");
                    sessionStorage.removeItem("after_login");
                    window.location.href = `seats.html?booking_id=${booking.id}&flight_id=${pendingFlight.id}`;
                    return;
                } catch (bookingErr) {
                    sessionStorage.removeItem("pending_flight");
                    sessionStorage.removeItem("after_login");
                    showMessage("message", "Login worked, but the selected flight could not be booked: " + bookingErr.message);
                    return;
                }
            }

            // Redirect to manage page
            window.location.href = "manage.html";

        } catch (err) {
            showMessage("message", err.message);
        }
    }

    // Allow pressing Enter to login
    document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
    });
</script>
</body>
</html>
