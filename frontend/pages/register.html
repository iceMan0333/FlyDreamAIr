<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – FlyDreamAir</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo">FlyDreamAir</a>
    <ul class="nav-links">
        <li><a href="index.html">Book</a></li>
        <li><a href="manage.html">Manage</a></li>
        <li><a href="shop.html">Shop</a></li>
    </ul>
    <span class="nav-icon">👤</span>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p>Join FlyDreamAir and start earning Dream Loyalty points.</p>

        <div id="message" class="alert" style="display:none;"></div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Alex Stratos" />
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" />
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="At least 6 characters" />
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Repeat your password" />
        </div>

        <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="register()">
            Create Account
        </button>

        <div class="auth-switch">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>
</div>

<script src="../js/main.js"></script>
<script>
    async function register() {
        hideMessage("message");

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm-password").value;

        // Validation
        if (!name || !email || !password) {
            showMessage("message", "Please fill in all fields.", "error");
            return;
        }
        if (password.length < 6) {
            showMessage("message", "Password must be at least 6 characters.", "error");
            return;
        }
        if (password !== confirm) {
            showMessage("message", "Passwords do not match.", "error");
            return;
        }

        try {
            // Register the user
            await apiRequest("/users/register", "POST", { name, email, password });

            showMessage("message", "Account created! Redirecting to login...", "success");

            // Wait 1.5 seconds then go to login
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);

        } catch (err) {
            showMessage("message", err.message, "error");
        }
    }
</script>
</body>
</html>
