<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – FlyDreamAir</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo">FlyDreamAir</a>
    <ul class="nav-links">
        <li><a href="index.html">Book</a></li>
        <li><a href="manage.html">Manage</a></li>
        <li><a href="shop.html">Shop</a></li>
    </ul>
    <span class="nav-icon" id="nav-user-icon" onclick="window.location.href='manage.html'">👤</span>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>
        <p>Join FlyDreamAir and start earning Dream Loyalty points.</p>

        <div id="message" class="alert" style="display:none;"></div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Alex Stratos" />
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="At least 6 characters" />
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm" placeholder="Repeat your password" />
        </div>

        <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="doRegister()">Create Account</button>

        <div class="auth-switch">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>
</div>

<script src="../js/main.js"></script>
<script>
    if (isLoggedIn()) window.location.href = "manage.html";

    function doRegister() {
        hideMessage("message");
        const name     = document.getElementById("name").value.trim();
        const email    = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirm  = document.getElementById("confirm").value;

        if (!name || !email || !password) {
            showMessage("message", "Please fill in all fields.", "error"); return;
        }
        if (password.length < 6) {
            showMessage("message", "Password must be at least 6 characters.", "error"); return;
        }
        if (password !== confirm) {
            showMessage("message", "Passwords do not match.", "error"); return;
        }
        try {
            const user = registerUser(name, email, password);
            saveToken("local-token-" + user.id);
            saveUser(user);
            showMessage("message", "Account created! Taking you to your dashboard...", "success");
            setTimeout(() => window.location.href = "manage.html", 1200);
        } catch (err) {
            showMessage("message", err.message, "error");
        }
    }
</script>
</body>
</html>
