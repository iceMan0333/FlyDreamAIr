<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed – FlyDreamAir</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo">FlyDreamAir</a>
    <ul class="nav-links">
        <li><a href="index.html">Book</a></li>
        <li><a href="manage.html">Manage</a></li>
        <li><a href="shop.html">Shop</a></li>
    </ul>
    <span class="nav-icon" id="nav-user-icon" onclick="window.location.href='manage.html'">👤</span>
</nav>

<!-- Banner -->
<div class="confirm-banner">
    <div class="check-icon">✓</div>
    <h1>Booking Confirmed!</h1>
    <p style="margin-top:10px; opacity:0.85; font-size:16px;" id="conf-code">–</p>
</div>

<!-- Details -->
<div class="confirm-details">
    <h3 style="font-size:18px; font-weight:700; color:var(--navy); margin-bottom:16px;">Flight Details</h3>

    <div class="confirm-detail-row">
        <span style="color:var(--gray);">Flight</span>
        <span id="det-flight" style="font-weight:600;">–</span>
    </div>
    <div class="confirm-detail-row">
        <span style="color:var(--gray);">From</span>
        <span id="det-from">–</span>
    </div>
    <div class="confirm-detail-row">
        <span style="color:var(--gray);">To</span>
        <span id="det-to">–</span>
    </div>
    <div class="confirm-detail-row">
        <span style="color:var(--gray);">Date</span>
        <span id="det-date">–</span>
    </div>
    <div class="confirm-detail-row">
        <span style="color:var(--gray);">Departure</span>
        <span id="det-dep">–</span>
    </div>
    <div class="confirm-detail-row">
        <span style="color:var(--gray);">Arrival</span>
        <span id="det-arr">–</span>
    </div>
    <div class="confirm-detail-row">
        <span style="color:var(--gray);">Card Charged</span>
        <span id="det-card">–</span>
    </div>
    <div class="confirm-detail-row" style="font-weight:700; font-size:16px;">
        <span>Total Paid</span>
        <span id="det-total" style="color:var(--navy);">–</span>
    </div>

    <div style="display:flex; gap:12px; margin-top:28px; justify-content:center;">
        <a href="manage.html" class="btn btn-primary">View My Trips</a>
        <a href="shop.html" class="btn btn-outline">Add In-Flight Services</a>
    </div>
</div>

<footer>
    <div class="footer-inner">
        <div class="footer-brand"><h3>FlyDreamAir</h3><p>© 2024 FlyDreamAir. The Ethereal Anchor Experience.</p></div>
    </div>
</footer>

<script src="../js/main.js"></script>
<script>
    const booking = JSON.parse(sessionStorage.getItem("last_booking") || "null");

    if (!booking) {
        window.location.href = "index.html";
    } else {
        const tax   = +(booking.total_price * 0.1).toFixed(2);
        const total = +(booking.total_price + tax).toFixed(2);

        document.getElementById("conf-code").textContent  = "Confirmation: " + booking.confirmation_code;
        document.getElementById("det-flight").textContent = booking.flight_number;
        document.getElementById("det-from").textContent   = booking.departure_city;
        document.getElementById("det-to").textContent     = booking.arrival_city;
        document.getElementById("det-date").textContent   = formatDate(booking.departure_date);
        document.getElementById("det-dep").textContent    = booking.departure_time;
        document.getElementById("det-arr").textContent    = booking.arrival_time;
        document.getElementById("det-card").textContent   = booking.card_last4 ? "•••• •••• •••• " + booking.card_last4 : "–";
        document.getElementById("det-total").textContent  = "$" + total.toFixed(2);
    }
</script>
</body>
</html>
