<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – FlyDreamAir</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo">FlyDreamAir</a>
    <ul class="nav-links">
        <li><a href="index.html">Book</a></li>
        <li><a href="manage.html">Manage</a></li>
        <li><a href="shop.html">Shop</a></li>
    </ul>
    <span class="nav-icon" id="nav-user-icon" onclick="window.location.href='manage.html'">👤</span>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p>Sign in to manage your flights and bookings.</p>

        <div id="message" class="alert alert-error" style="display:none;"></div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" />
        </div>

        <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="doLogin()">Sign In</button>

        <div class="auth-switch">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>
</div>

<script src="../js/main.js"></script>
<script>
    // If already logged in, go straight to manage
    if (isLoggedIn()) window.location.href = "manage.html";

    function doLogin() {
        hideMessage("message");
        const email    = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            showMessage("message", "Please enter your email and password.");
            return;
        }
        try {
            const user = loginUser(email, password);
            saveToken("local-token-" + user.id);
            saveUser(user);
            // Go to the page they were trying to visit, or manage
            const redirect = sessionStorage.getItem("redirect_after_login") || "manage.html";
            sessionStorage.removeItem("redirect_after_login");
            window.location.href = redirect;
        } catch (err) {
            showMessage("message", err.message);
        }
    }

    document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
