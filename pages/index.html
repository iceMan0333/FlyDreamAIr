<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlyDreamAir - Home</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">FlyDreamAir</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="manage.html">Manage Trips</a>
      <span class="nav-icon" onclick="goToAccount()">👤</span>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>Book your next dream flight</h1>
      <p>Search flights, choose seats, add in-flight services, and manage your trip.</p>
    </div>
  </section>

  <main class="container">
    <div class="search-box">
      <div class="form-group">
        <label>From</label>
        <input type="text" id="from-input" value="Sydney" />
      </div>
      <div class="form-group">
        <label>To</label>
        <input type="text" id="to-input" value="Melbourne" />
      </div>
      <button class="btn btn-primary" onclick="searchFlightsFromHome()">Search Flights</button>
    </div>

    <section class="section">
      <h2>Popular Destinations</h2>
      <div class="grid-3">
        <div class="card"><h3>Melbourne</h3><p>From $180</p></div>
        <div class="card"><h3>Brisbane</h3><p>From $220</p></div>
        <div class="card"><h3>Tokyo</h3><p>From $890</p></div>
      </div>
    </section>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
