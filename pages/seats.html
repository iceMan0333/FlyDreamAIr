<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Selection - FlyDreamAir</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">FlyDreamAir</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="manage.html">Manage Trips</a>
    </div>
  </nav>

  <main class="container">
    <h1>Select Your Seat</h1>
    <p id="flight-subtitle">Flight details</p>

    <div class="dashboard-grid">
      <div class="card">
        <h2>Seat Map</h2>
        <div id="seat-map"></div>
      </div>
      <div class="card">
        <h2>Selected Seat</h2>
        <div id="selected-seat-label" style="font-size:48px; font-weight:bold;">-</div>
        <button class="btn btn-primary" onclick="continueToAddons()">Continue to Add-ons</button>
      </div>
    </div>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
