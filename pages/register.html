<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - FlyDreamAir</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <h1>Create Account</h1>
      <div id="message" class="alert" style="display:none;"></div>
      <div class="form-group"><label>Name</label><input type="text" id="name" /></div>
      <div class="form-group"><label>Email</label><input type="email" id="email" /></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" /></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" id="confirm-password" /></div>
      <button class="btn btn-primary" style="width:100%;" onclick="registerUser()">Register</button>
      <p style="margin-top:16px;">Already registered? <a href="login.html">Login</a></p>
    </div>
  </main>
  <script src="../js/main.js"></script>
</body>
</html>
