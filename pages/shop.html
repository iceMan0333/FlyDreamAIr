<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add-ons - FlyDreamAir</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">FlyDreamAir</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="manage.html">Manage Trips</a>
    </div>
  </nav>

  <main class="container">
    <h1>In-flight Services</h1>
    <p>Select optional food, comfort, or service add-ons.</p>

    <div class="dashboard-grid">
      <div>
        <div id="addons-container" class="grid-2"></div>
      </div>
      <div class="card">
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <h3>Total: <span id="cart-total">$0.00</span></h3>
        <button class="btn btn-primary" onclick="finishBooking()">Confirm Booking</button>
      </div>
    </div>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
